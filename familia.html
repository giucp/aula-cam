<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Panel familiar · Chispa</title>
<meta name="description" content="Panel para padres: tiempo de estudio, resultados por materia, errores, tareas y uso de Chispa." />
<meta name="theme-color" content="#F4F5F7" />
<meta name="color-scheme" content="light" />
<meta name="robots" content="noindex" />
<link rel="manifest" href="/familia.webmanifest" />
<link rel="icon" href="/familia-favicon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="/familia-apple-touch.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Familia · Chispa" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- fuentes NO bloqueantes: la página renderiza al toque con la tipografía del sistema y
     cambia a Fredoka/Nunito cuando llegan (clave en redes lentas: no espera a Google) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" /></noscript>
<style>
  /* Panel familiar · 2026-10-29. Herramienta para ADULTOS: estética neutra y sobria (no la de
     Chispa): grises pizarra, un solo acento índigo, Inter, sin emojis. Mobile-first; en pantallas
     anchas el contenido se centra a 1040px y los indicadores pasan a 3 y 6 columnas. */
  :root{
    --bg:#F4F5F7;--card:#FFFFFF;--ink:#111827;--ink2:#374151;--mut:#6B7280;--line:#E5E7EB;--line2:#F0F1F3;
    --acc:#4338CA;--acc-bg:#EEF2FF;--ok:#047857;--ok-bg:#ECFDF5;--med:#B45309;--med-bg:#FFFBEB;--bad:#B91C1C;--bad-bg:#FEF2F2;
    --r:12px;--sh:0 1px 2px rgba(17,24,39,.05),0 1px 3px rgba(17,24,39,.04);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{color-scheme:light;background:var(--bg)}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1040px;margin:0 auto;padding:12px 16px 48px}
  h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
  b{font-weight:600}
  .ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .sec{color:var(--mut);margin:4px 0 0;font-size:.9rem}
  .ok{color:var(--ok)}.med{color:var(--med)}.bad{color:var(--bad)}.t-bad{color:var(--bad);font-weight:600}
  /* barra superior */
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 10px}
  .marca{font-weight:700;font-size:.95rem;color:var(--ink)}
  .marca span{font-weight:500;color:var(--mut)}
  .acciones{display:flex;gap:6px;align-items:center}
  .icoBtn{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);background:var(--card);border-radius:10px;color:var(--ink2);cursor:pointer;font-size:1.1rem;line-height:1;list-style:none}
  .icoBtn::-webkit-details-marker{display:none}
  .menu{position:relative}
  .menuPop{position:absolute;right:0;top:42px;z-index:20;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px -12px rgba(17,24,39,.25);padding:6px;min-width:230px}
  .menuPop button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:10px 12px;border-radius:8px;font:inherit;font-size:.9rem;color:var(--ink2);cursor:pointer;text-align:left}
  .menuPop button:hover{background:var(--line2)}
  .hijos{display:flex;gap:6px;margin:0 0 12px;overflow-x:auto}
  .hijo{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font:inherit;font-size:.88rem;font-weight:600;color:var(--ink2);cursor:pointer;white-space:nowrap}
  .hijo[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  /* encabezado del hijo */
  .perfil{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 12px}
  .perfil h1{font-size:1.55rem}
  .seg{display:inline-flex;background:#E9EAEE;border-radius:10px;padding:3px;gap:2px}
  .seg button{border:0;background:none;border-radius:8px;padding:7px 12px;font:inherit;font-size:.84rem;font-weight:600;color:var(--mut);cursor:pointer;white-space:nowrap}
  .seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
  .indice{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 12px;padding:6px 16px 8px;scrollbar-width:none;position:sticky;top:0;z-index:10;background:linear-gradient(var(--bg) 80%,rgba(244,245,247,0))}
  .indice::-webkit-scrollbar{display:none}
  .indice a{flex:none;font-size:.82rem;font-weight:600;color:var(--ink2);text-decoration:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px}
  /* indicadores */
  .kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--sh);min-width:0}
  .kLbl{font-size:.72rem;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
  .kVal{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;line-height:1.2}
  .kVal small{font-size:.9rem;color:var(--mut);font-weight:600}
  .kSub{font-size:.78rem;color:var(--mut);overflow-wrap:anywhere}
  .kpi.bad{border-color:#FECACA}.kpi.bad .kVal{color:var(--bad)}
  .kpi.ok .kVal{color:var(--ok)}.kpi.med .kVal{color:var(--med)}
  /* tarjetas */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--sh);scroll-margin-top:56px}
  .card h2{font-size:1.02rem;display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .card h3{font-size:.92rem;margin:4px 0 8px;display:flex;align-items:center;gap:8px}
  .cnt{font-size:.74rem;font-weight:600;color:var(--mut);background:var(--line2);border-radius:999px;padding:2px 8px}
  .ayuda{font-size:.84rem;color:var(--mut);margin:-4px 0 12px}
  .vacio{color:var(--mut);font-size:.9rem;margin:0}
  .leyenda{font-size:.84rem;color:var(--mut);margin:8px 0 0}
  .sep{height:1px;background:var(--line);margin:16px 0}
  .pill{display:inline-block;font-size:.76rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--line2);color:var(--ink2);white-space:nowrap}
  .pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.med,.pill.warn{background:var(--med-bg);color:var(--med)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.ind{background:var(--acc-bg);color:var(--acc)}
  /* alertas */
  .alertas{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  .alertas li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;border:1px solid var(--line)}
  .alertas li.bad{background:var(--bad-bg);border-color:#FECACA;color:var(--bad)}
  .alertas li.warn{background:var(--med-bg);border-color:#FDE68A;color:var(--med)}
  .alertas li div{display:flex;flex-direction:column;min-width:0;color:var(--ink)}
  .alertas li b{font-size:.9rem;overflow-wrap:anywhere}
  .alertas li span{font-size:.8rem;color:var(--ink2);overflow-wrap:anywhere}
  .ok-line{display:flex;gap:8px;align-items:center;color:var(--ok);font-size:.9rem;margin:0}
  /* gráfico */
  .graf{width:100%;height:auto;display:block}
  .graf .bar{fill:var(--acc)}
  .graf .gl{stroke:var(--line2)}.graf .gb{stroke:var(--line)}
  .graf .gt,.graf .gx{font-size:11px;fill:var(--mut);font-family:inherit}
  .graf .gx{text-anchor:middle}
  /* materias */
  .mat{border-top:1px solid var(--line)}
  .mat:first-of-type{border-top:0}
  .mat summary{display:flex;align-items:center;gap:10px;padding:11px 0;cursor:pointer;list-style:none}
  .mat summary::-webkit-details-marker,.errGrupo summary::-webkit-details-marker,.plieg summary::-webkit-details-marker,.expl summary::-webkit-details-marker{display:none}
  .mNom{flex:1;min-width:0;font-weight:600;font-size:.92rem}
  .mCel{display:flex;flex-direction:column;align-items:flex-end;min-width:46px}
  .mCel b{font-size:.9rem}.mCel small{color:var(--mut);font-size:.7rem}
  .chev{color:var(--mut);transition:transform .15s}
  details[open]>summary .chev{transform:rotate(90deg)}
  .temas{padding:0 0 10px}
  .tema{display:flex;justify-content:space-between;gap:10px;padding:9px 10px;border-radius:8px;background:#FAFAFB;margin-bottom:6px}
  .temaTx{display:flex;flex-direction:column;gap:5px;min-width:0}
  .temaTx b{font-size:.86rem;font-weight:600;overflow-wrap:anywhere}
  .temaMeta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:.76rem;color:var(--mut);text-align:right;flex:none}
  .pasos{display:flex;flex-wrap:wrap;gap:4px}
  .paso{font-size:.7rem;font-weight:600;padding:2px 7px;border-radius:6px;border:1px dashed #D1D5DB;color:#9CA3AF}
  .paso.on{border:1px solid transparent;background:var(--acc-bg);color:var(--acc)}
  /* tablas */
  .tabla{overflow-x:auto;margin:0 -4px}
  table{width:100%;border-collapse:collapse;font-size:.86rem}
  th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)}
  td{padding:9px 4px;border-bottom:1px solid var(--line2);vertical-align:top}
  td small{display:block;color:var(--mut);font-size:.76rem;margin-top:1px}
  td.r,th.r{text-align:right}.nw{white-space:nowrap}
  /* errores */
  .errGrupo{border-top:1px solid var(--line)}
  .errGrupo:first-of-type{border-top:0}
  .errGrupo summary{display:flex;align-items:center;gap:10px;padding:11px 0;cursor:pointer;list-style:none;font-weight:600;font-size:.9rem}
  .errGrupo summary span:first-child{flex:1;min-width:0}
  .err{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px}
  .errQ{margin:0 0 8px;font-size:.9rem;white-space:pre-line}
  .resp{display:flex;gap:8px;align-items:flex-start;margin:0 0 6px;font-size:.86rem;padding:7px 9px;border-radius:8px}
  .resp span{display:flex;flex-direction:column}.resp small{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;opacity:.8}
  .resp.bad{background:var(--bad-bg)}.resp.ok{background:var(--ok-bg)}
  .expl summary{cursor:pointer;color:var(--acc);font-size:.84rem;font-weight:600;list-style:none;padding:4px 0}
  .expl p{margin:4px 0 0;font-size:.86rem;color:var(--ink2);white-space:pre-line}
  .errF{margin:6px 0 0;font-size:.76rem;color:var(--mut)}
  /* historial */
  .sel{width:100%;font:inherit;font-size:.9rem;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:12px;color:var(--ink)}
  .hDia{margin-bottom:14px}.hDia.oculto{display:none}
  .hDiaTit{display:flex;justify-content:space-between;gap:8px;font-size:.84rem;padding:0 0 6px;border-bottom:1px solid var(--line);margin-bottom:4px}
  .hDiaTit span{color:var(--mut)}
  .ev{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--line2)}
  .ev:last-child{border-bottom:0}
  .evH{flex:none;width:64px;font-size:.78rem;color:var(--mut);padding-top:1px;font-variant-numeric:tabular-nums}
  .evTx{display:flex;flex-direction:column;gap:2px;min-width:0}
  .evTx b{font-size:.88rem}.evTx span{font-size:.84rem;color:var(--ink2);overflow-wrap:anywhere}.evTx small{font-size:.78rem;color:var(--mut)}
  /* agenda */
  .tarea{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2)}
  .tTx{display:flex;flex-direction:column;gap:2px;min-width:0}
  .tTx b{font-size:.88rem;font-weight:500}.tTx span{font-size:.78rem;color:var(--mut)}
  .clamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;cursor:pointer}
  .clamp.abierto{display:block}
  .tarea.hecha b{text-decoration:line-through;color:var(--mut)}
  .plieg{margin-top:10px}
  .plieg summary{cursor:pointer;font-size:.86rem;font-weight:600;color:var(--acc);list-style:none;padding:6px 0}
  .horario{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:6px}
  .horario div{display:flex;flex-direction:column;gap:4px;background:#FAFAFB;border-radius:8px;padding:8px 6px;min-width:0}
  .horario b{font-size:.72rem;color:var(--mut);text-transform:uppercase}
  .horario span{font-size:.74rem;overflow-wrap:anywhere}.mut{color:var(--mut)}
  /* uso */
  .mini3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
  .mini3 div{background:#FAFAFB;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
  .mini3 span{font-size:.72rem;color:var(--mut)}.mini3 b{font-size:1.1rem}
  .franjas{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
  .fr{display:grid;grid-template-columns:96px 1fr 28px;gap:10px;align-items:center;font-size:.84rem}
  .fr span{display:flex;flex-direction:column}.fr span small{color:var(--mut)}
  .fr i{height:8px;background:var(--line2);border-radius:99px;overflow:hidden}
  .fr em{display:block;height:100%;background:var(--acc);border-radius:99px}
  .fr b{text-align:right}
  .lista{list-style:none;margin:6px 0 0;padding:0}
  .lista li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line2);font-size:.86rem}
  .lista li span{min-width:0;overflow-wrap:anywhere}.lista li b{flex:none;font-weight:500;color:var(--ink2)}
  /* avisos */
  .aviso{font-size:.86rem;padding:10px 12px;border-radius:10px;margin:0 0 12px}
  .aviso.warn{background:var(--med-bg);color:#92400E;border:1px solid #FDE68A}
  .aviso.bad{background:var(--bad-bg);color:var(--bad);border:1px solid #FECACA}
  .lnk{border:0;background:none;color:inherit;font:inherit;font-weight:600;text-decoration:underline;cursor:pointer;padding:0}
  .pie{text-align:center;color:var(--mut);font-size:.78rem;margin-top:20px}
  .pie p{margin:0 0 6px}.pie .ver{opacity:.7}
  /* pantallas sueltas: vincular / sin conexión / escáner */
  .pantalla{max-width:420px;margin:24px auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 20px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:10px}
  .pantalla .marca{margin-bottom:6px}
  .pantalla h1{font-size:1.35rem}
  .lbl{font-size:.82rem;font-weight:600;color:var(--ink2);margin-top:6px}
  .codeIn{width:100%;font:inherit;font-size:1.35rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;text-align:center;padding:12px;border:1px solid #D1D5DB;border-radius:10px;outline:none;color:var(--ink)}
  .codeIn:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(67,56,202,.15)}
  .codeIn::placeholder{color:#C4C7CE;letter-spacing:.16em}
  .btn{font:inherit;font-weight:600;font-size:.95rem;border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:10px;padding:12px 16px;cursor:pointer}
  .btn:disabled{opacity:.6}
  .btn.sec2{background:var(--card);color:var(--ink);border-color:var(--line)}
  .btn.link{background:none;border:0;color:var(--acc);padding:8px}
  .btn.full{width:100%;margin-top:4px}
  .nota{font-size:.8rem;color:var(--mut);margin:6px 0 0}
  .scanWrap video{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;background:#111827}
  .cargando{display:flex;flex-direction:column;align-items:center;gap:12px;margin:80px auto;color:var(--mut);font-size:.88rem}
  .spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--acc);animation:gira .8s linear infinite}
  @keyframes gira{to{transform:rotate(360deg)}}
  @media (min-width:760px){
    .wrap{padding:20px 24px 60px}
    .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
    .perfil h1{font-size:1.8rem}
  }
  @media (min-width:1000px){ .kpis{grid-template-columns:repeat(6,minmax(0,1fr))} }
  @media (max-width:360px){ .mCel{min-width:38px} .evH{width:54px} .seg button{padding:7px 9px} }
  .graf .gv{font-size:11px;fill:var(--ink2);font-weight:600;text-anchor:middle;font-family:inherit}
  .alertas li b{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}

  /* toques de color (2026-10-29): tonos propios por indicador y sección, siempre en placas suaves */
  :root{--t-acc:#4338CA;--t-ind:#4F46E5;--t-tea:#0D9488;--t-blu:#2563EB;--t-vio:#7C3AED;--t-amb:#D97706;--t-ros:#E11D48;--t-gri:#64748B}
  .kpi{position:relative;overflow:hidden}
  .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--k)}
  .kHead{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .kIco{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;color:var(--k);background:color-mix(in srgb,var(--k) 12%,#fff)}
  .kIco .ico{width:16px;height:16px}
  .kLbl{line-height:1.2}
  .hIco{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;color:var(--k);background:color-mix(in srgb,var(--k) 12%,#fff)}
  .hIco .ico{width:16px;height:16px}
  .mNom{display:flex;align-items:center;gap:8px}
  .mDot{width:10px;height:10px;border-radius:3px;flex:none;background:var(--m)}
  .mat[open] .temas{border-left:3px solid color-mix(in srgb,var(--k) 30%,#fff);padding-left:8px}
  .tipo{align-self:flex-start;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:6px;margin-bottom:2px}
  .t-resumen{background:#EFF6FF;color:#1D4ED8}
  .t-retos{background:#F0FDFA;color:#0F766E}
  .t-quiz{background:#F5F3FF;color:#6D28D9}
  .t-examen{background:#FFFBEB;color:#B45309}
  .graf .bar{fill:#A5B4FC}
  .graf .bar.hoy{fill:var(--acc)}
  .indice a:hover{border-color:#C7D2FE;color:var(--acc)}
  .fr em{background:linear-gradient(90deg,#818CF8,#4F46E5)}
  .resp.ok .ico{color:var(--ok)}.resp.bad .ico{color:var(--bad)}
</style>
</head>
<body>
  <div class="wrap" id="app">
    <div class="cargando"><div class="spin"></div><p>Cargando el panel…</p></div>
  </div>
  <script>
    // SW propio del panel (scope /familia: NO toca el del aula del niño en aula-cam).
    // En el dominio del panel (chispa-familia), ANTES de registrar, desregistramos cualquier
    // SW ajeno que haya quedado de cuando la raíz servía la app del niño (scope "/"): esos
    // SW viejos interceptaban la página con estrategias que no son de acá.
    if ("serviceWorker" in navigator) {
      try {
        var esDominioPanel = !/aula-cam/.test(location.host);
        var listo = Promise.resolve();
        if (esDominioPanel && navigator.serviceWorker.getRegistrations) {
          listo = navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (r) {
              if (r.scope.indexOf("/familia") === -1) return r.unregister().catch(function(){});
            }));
          }).catch(function(){});
        }
        listo.then(function () {
          navigator.serviceWorker.register("/familia-sw.js", { scope: "/familia" }).catch(function(){});
        });
      } catch (e) {}
    }
  </script>
  <script src="familia.js"></script>
</body>
</html>
